name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build-only

      - name: Copy assets to backend
        run: |
          mkdir -p backend/public/assets
          cp -r dist/assets/* backend/public/assets/

      - name: Push assets to dist-v2 branch
        id: push_assets
        run: |
          # Save assets to temp directory
          mkdir -p /tmp/assets-backup
          cp -r backend/public/assets/* /tmp/assets-backup/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create orphan dist-v2 branch with only assets (keeps v1 dist untouched)
          git checkout --orphan dist-temp
          git reset --hard
          git clean -fd
          
          # Restore assets and commit
          mkdir -p backend/public/assets
          cp -r /tmp/assets-backup/* backend/public/assets/
          git add -f backend/public/assets/
          git commit -m "Assets for ${{ github.ref_name }}"
          
          ASSETS_SHA="$(git rev-parse HEAD)"
          echo "assets_sha=${ASSETS_SHA}" >> "${GITHUB_OUTPUT}"
          
          # Force push to dist-v2 branch
          git push origin dist-temp:dist-v2 --force

      - name: Checkout again for package build
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js again
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies again
        run: npm ci

      - name: Build installer package with CDN
        run: npm run package
        env:
          CDN_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.push_assets.outputs.assets_sha }}/backend/public

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

